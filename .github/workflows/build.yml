name: Build

on:
  push:
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Name the APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="build-${GITHUB_SHA::7}"
          mv app/build/outputs/apk/release/*.apk "musely-${version}.apk"
          ls -l musely-*.apk | awk '{printf "APK size: %.2f MB\n", $5/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: musely-release-apk
          path: musely-*.apk
      - name: Publish GitHub release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" musely-*.apk --title "Musely $GITHUB_REF_NAME" --notes-file .github/release-notes.md

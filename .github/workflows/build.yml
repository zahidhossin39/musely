name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}

jobs:
  apk:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests, Android Lint, and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Package APK & SHA-256 checksum
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} == 1 )) || { echo "Expected 1 release APK, found ${#apks[@]}"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || version="build-${GITHUB_SHA::7}"
          apk_file="musely-${version}.apk"
          mv "${apks[0]}" "$apk_file"
          sha256sum "$apk_file" > "${apk_file}.sha256"
          size_bytes=$(stat -c%s "$apk_file")
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          sha256=$(cut -d' ' -f1 "${apk_file}.sha256")
          {
            echo "- **APK:** \`${apk_file}\` (${size_mb} MB)"
            echo "- **SHA-256:** \`${sha256}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: musely-release-apk
          path: |
            musely-*.apk
            musely-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: apk
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: musely-release-apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/musely-*.apk dist/musely-*.apk.sha256)
          (( ${#files[@]} >= 1 )) || { echo "No release artifacts found"; exit 1; }
          if [[ -s .github/release-notes.md ]]; then
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Musely $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Musely $GITHUB_REF_NAME" \
              --generate-notes
          fi

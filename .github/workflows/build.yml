name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Prepare release signing keystore
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$RELEASE_KEYSTORE_BASE64" && -n "$RELEASE_KEYSTORE_PASSWORD" && -n "$RELEASE_KEY_ALIAS" && -n "$RELEASE_KEY_PASSWORD" ]]; then
            keystore_path="${RUNNER_TEMP}/musely-release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > "$keystore_path"
            chmod 600 "$keystore_path"
            echo "keystore_path=${keystore_path}" >> "$GITHUB_OUTPUT"
            echo "has_release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets are not configured; falling back to debug signing."
            echo "has_release_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests, Android Lint, and build release APK
        env:
          MUSELY_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          MUSELY_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MUSELY_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MUSELY_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          version_code=$(( 4 + GITHUB_RUN_NUMBER ))
          gradle_args=(-PversionCode="$version_code")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gradle_args+=(-PversionName="${GITHUB_REF_NAME#v}")
          fi
          ./gradlew --no-daemon "${gradle_args[@]}" testDebugUnitTest lintDebug assembleRelease

      - name: Remove temporary signing keystore
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/musely-release.keystore" ]]; then
            shred -u "${RUNNER_TEMP}/musely-release.keystore" 2>/dev/null || rm -f "${RUNNER_TEMP}/musely-release.keystore"
          fi

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Package APK & SHA-256 checksum
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          (( ${#apks[@]} == 1 )) || { echo "Expected 1 release APK, found ${#apks[@]}"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="build-${GITHUB_SHA::7}"
          fi
          canonical_apk="Musely.apk"
          apk_file="musely-${version}.apk"
          cp "${apks[0]}" "$canonical_apk"
          mv "${apks[0]}" "$apk_file"
          sha256sum "$canonical_apk" > "${canonical_apk}.sha256"
          sha256sum "$apk_file" > "${apk_file}.sha256"
          sha256sum -c "${canonical_apk}.sha256"
          sha256sum -c "${apk_file}.sha256"
          size_bytes=$(stat -c%s "$apk_file")
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.2f", b / 1048576 }')
          sha256=$(cut -d' ' -f1 "${apk_file}.sha256")
          {
            echo "- **APKs:** \`${canonical_apk}\`, \`${apk_file}\` (${size_mb} MB)"
            echo "- **SHA-256:** \`${sha256}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: musely-release-apk
          path: |
            Musely.apk
            Musely.apk.sha256
            musely-*.apk
            musely-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: apk
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release APK artifact
        uses: actions/download-artifact@v8
        with:
          name: musely-release-apk
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          canonical_apk="Musely.apk"
          canonical_sha="${canonical_apk}.sha256"
          apk_file="musely-${version}.apk"
          sha_file="${apk_file}.sha256"
          [[ -f "dist/$canonical_apk" ]] || { echo "Missing release APK: dist/$canonical_apk"; exit 1; }
          [[ -f "dist/$canonical_sha" ]] || { echo "Missing checksum file: dist/$canonical_sha"; exit 1; }
          [[ -f "dist/$apk_file" ]] || { echo "Missing release APK: dist/$apk_file"; exit 1; }
          [[ -f "dist/$sha_file" ]] || { echo "Missing checksum file: dist/$sha_file"; exit 1; }
          (cd dist && sha256sum -c "$canonical_sha" && sha256sum -c "$sha_file")

          release_args=(--title "Musely $GITHUB_REF_NAME" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          notes_file=""
          if [[ -s .github/release-notes.md ]]; then
            notes_ver=$(sed -nE 's/^#{1,3}[[:space:]]+Musely[[:space:]]+v?([0-9][^[:space:]]*).*/\1/p' .github/release-notes.md | head -n1)
            if [[ -z "$notes_ver" || "$notes_ver" == "$version" ]]; then
              notes_file=".github/release-notes.md"
            else
              echo "::warning file=.github/release-notes.md::.github/release-notes.md targets '${notes_ver}', not '${version}'; ignoring stale notes."
            fi
          fi

          generated_notes=""
          if [[ -z "$notes_file" && -s CHANGELOG.md ]]; then
            extracted_notes=$(mktemp)
            awk -v hdr="## [${version}]" '
              BEGIN { capture = 0 }
              !capture && ($0 == hdr || substr($0, 1, length(hdr) + 1) == hdr " ") {
                capture = 1
                next
              }
              capture && /^## \[/ { exit }
              capture && /^\[[^]]+\]:[[:space:]]/ { exit }
              capture { print }
            ' CHANGELOG.md > "$extracted_notes"
            if [[ -s "$extracted_notes" ]] && grep -q '[^[:space:]]' "$extracted_notes"; then
              generated_notes=$(mktemp)
              {
                echo "## Musely ${version}"
                cat "$extracted_notes"
                echo ""
                echo "**Install:** download \`${canonical_apk}\` (or \`${apk_file}\`) below, verify \`${canonical_sha}\` if desired, open the APK on your phone, and allow installs from your browser if asked."
              } > "$generated_notes"
              notes_file="$generated_notes"
            fi
            rm -f "$extracted_notes"
          fi

          notes_args=(--generate-notes)
          if [[ -n "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft)
            if [[ "$is_draft" == "true" ]]; then
              gh release upload "$GITHUB_REF_NAME" "dist/$canonical_apk" "dist/$canonical_sha" "dist/$apk_file" "dist/$sha_file" --clobber
              edit_args=(--draft=false --title "Musely $GITHUB_REF_NAME")
              [[ "$GITHUB_REF_NAME" == *-* ]] && edit_args+=(--prerelease)
              [[ -n "$notes_file" ]] && edit_args+=(--notes-file "$notes_file")
              gh release edit "$GITHUB_REF_NAME" "${edit_args[@]}"
            else
              rm -f "$generated_notes"
              echo "Release $GITHUB_REF_NAME already exists and is published."
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" "dist/$canonical_apk" "dist/$canonical_sha" "dist/$apk_file" "dist/$sha_file" "${release_args[@]}" "${notes_args[@]}"
          fi
          rm -f "$generated_notes"

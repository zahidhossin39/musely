name: Feature Request
description: Suggest an improvement or new feature for Musely
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Musely aims to stay a calm, lightweight, 100% offline music player. Share how your idea fits that philosophy!

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What experience or workflow would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how you envision this working in Musely.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope alignment
      options:
        - label: This feature works strictly offline without network access, accounts, or tracking.
          required: true

name: Bug Report
description: Report a crash, playback issue, cover art problem, or UI glitch
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in **Musely**! Please check [Releases](https://github.com/zahidhossin39/musely/releases) first to make sure you are on the latest version.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open Musely and grant audio permission
        2. Go to Albums / Songs
        3. Tap on ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Musely version
      description: Version installed on your device (e.g. `1.0.0`).
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android version & device model
      description: Device model and Android release / API level.
      placeholder: "Pixel 8, Android 15 (API 35)"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Audio file format (MP3, FLAC, M4A, Opus...), embedded artwork details, screenshots, or logcat output.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission check
      options:
        - label: I checked existing issues and the latest release to avoid duplicates.
          required: true
